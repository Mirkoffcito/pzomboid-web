volumes:
  deps:
  build:
  node_modules:
  pg_data:
  mix_home:

services:
  zomboid_web:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    working_dir: /app
    ports:
      - "4000:4000"
    networks:
      - zomboid_net
      - internal
    environment:
      MIX_ENV: dev
      PHX_SERVER: "true"
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: tfz_dev
      WATCH_TTY: "1"
      HOME: /app     
      MIX_HOME: /app/.mix
      HEX_HOME: /app/.mix
      RCON_HOST: "${RCON_HOST}"
      RCON_PORT: "${RCON_PORT}"
      RCON_PASSWORD: "${RCON_PASSWORD}"
      RCON_POLL_MS: "2000"
      ZOMBOID_NAME: "${SERVER_NAME}"
      ZOMBOID_HOST: "${SERVER_HOST}"
      ZOMBOID_PORT: "${SERVER_PORT}"
    volumes:
      - .:/app
      - deps:/app/deps
      - build:/app/_build
      - node_modules:/app/assets/node_modules
      - mix_home:/app/.mix
    user: "${UID:-1000}:${GID:-1000}"
    command: ["bash","-lc","mix phx.server"]
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true

  # One-off Node helper to hydrate /app/assets/node_modules (shared volume)
  node:
    image: node:20-slim
    working_dir: /app/assets
    environment:
      - NPM_CONFIG_CACHE=/app/.npm
    volumes:
      - .:/app:delegated
      - node_modules:/app/assets/node_modules
    user: "${UID:-1000}:${GID:-1000}"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tfz_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tfz_dev"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - internal

networks:
  internal:
  zomboid_net:
    external: true

